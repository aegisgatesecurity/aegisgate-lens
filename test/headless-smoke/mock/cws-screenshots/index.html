<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat (AegisGate Lens CWS Screenshot Mock)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #1a1a1a;
      min-height: 100vh;
    }
    .header {
      padding: 12px 24px;
      border-bottom: 1px solid #e5e5e5;
      font-size: 14px;
      color: #666;
      background: #fafafa;
    }
    .header h1 { margin: 0; font-size: 16px; font-weight: 600; color: #1a1a1a; }
    .chat-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
    }
    .messages {
      min-height: 300px;
      margin-bottom: 24px;
    }
    .message {
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 8px;
      background: #f5f5f5;
      font-size: 14px;
      line-height: 1.5;
    }
    .input-area {
      position: relative;
      border: 1px solid #d0d0d0;
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    textarea#prompt-textarea {
      width: 100%;
      min-height: 80px;
      border: none;
      outline: none;
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      background: transparent;
    }
    .send-button {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 16px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .send-button:hover { background: #333; }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI Chat</h1>
  </div>
  <div class="chat-container">
    <div class="messages">
      <div class="message">How can I help you today?</div>
    </div>
    <div class="input-area">
      <textarea id="prompt-textarea" placeholder="Message AI Chat..."></textarea>
      <button class="send-button">Send</button>
    </div>
  </div>
</body>
</html>
