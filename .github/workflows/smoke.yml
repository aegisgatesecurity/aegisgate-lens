# AegisGate Lens - Headless Smoke Test CI
#
# This workflow runs the headless smoke test (test/headless-smoke/)
# plus the full unit test suite on:
#   - Every PR to main
#   - Every push to a v0.1.x branch (v0.1.3, v0.1.4, etc.)
#   - Weekly cron (Mondays 09:00 UTC) for regression detection
#
# The smoke test drives a real Chrome browser via the CDP (Chrome
# DevTools Protocol) and exercises the 15 detection cases against
# the SHIP-READY bundle (not the source). A regression here means
# the actual user-facing behavior broke.
#
# Per the v0.1.3 B6 plan item, this CI integration is the standing
# answer to "is Lens still working in a real browser?"
#
# Apache 2.0. Copyright 2026 AegisGate Security, LLC.

name: Headless Smoke

on:
  pull_request:
    branches: [main, 'v0.1.*']
  push:
    branches: ['v0.1.*']
  workflow_dispatch:  # allow manual runs
  schedule:
    # Weekly: Monday 09:00 UTC
    - cron: '0 9 * * 1'

# Cancel any in-progress run for the same branch
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Headless smoke + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5  # smoke is ~20s; unit tests ~1s; build ~10s; leaves headroom for retries

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (for unit tests + bundle.js rebuild)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go (for the smoke binary)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Chromium dependencies
        # The smoke binary expects a chromium binary. The GitHub Actions
        # ubuntu-latest runner ships with Chrome pre-installed. We use
        # the system chromium for the smoke. The smoke binary's --chromium
        # flag defaults to /usr/bin/chromium, which is available on the
        # runner.
        run: |
          which chromium-browser || which chromium || which google-chrome
          chromium --version 2>/dev/null || google-chrome --version 2>/dev/null
          ls -la /usr/bin/chromium* 2>/dev/null || ls -la /usr/bin/google-chrome* 2>/dev/null

      - name: Install Python3 (for the bundle.js rebuild script)
        run: |
          python3 --version
          # We don't need Pillow here (the PNG generation is a one-time
          # dev step, not a CI step).

      - name: Run unit tests
        # 405 tests, ~1s. No network, no browser, no deps. Must pass
        # before the smoke runs.
        run: |
          node --test test/unit/*.test.mjs 2>&1 | tee unit-test-output.log
          # Fail the build if any test failed
          grep -E "ℹ fail [1-9]" unit-test-output.log && exit 1 || true
          # Alternative: check exit code from the node command
          node --test test/unit/*.test.mjs > /dev/null 2>&1 || (echo "Unit tests failed"; exit 1)

      - name: Build the smoke binary
        # The Go binary is built from tools/headless-smoke/flow/.
        # The output is the test/headless-smoke/headless-smoke-bin
        # which the runner will execute.
        #
        # IMPORTANT: `go build -o` resolves the output path relative to
        # the CURRENT working directory (which after `cd` is
        # tools/headless-smoke/flow/). To get the binary to the right
        # place, we use ${GITHUB_WORKSPACE} (the absolute path to the
        # repo root on the runner, set by GitHub Actions) as the
        # prefix for -o.
        run: |
          cd tools/headless-smoke/flow
          go build -o ${GITHUB_WORKSPACE}/test/headless-smoke/headless-smoke-bin .
          # Verify the binary was built (also at the absolute path)
          test -f ${GITHUB_WORKSPACE}/test/headless-smoke/headless-smoke-bin && echo "Binary built OK" || (echo "Binary NOT built"; exit 1)
          ls -la ${GITHUB_WORKSPACE}/test/headless-smoke/headless-smoke-bin

      - name: Build the test bundle
        # The smoke loads test/headless-smoke/dist/ which is the SHIP-READY
        # bundle (NOT the source). It is NOT in git (it's a build artifact);
        # we build it from src/ in this CI run.
        #
        # IMPORTANT: On a fresh checkout, test/headless-smoke/dist/ does
        # NOT exist (it's gitignored). We must create it before the
        # copy. Then we copy the entire src/ tree into it (including
        # banner-{1x,2x,3x}.png from B5), then run build-bundle.py
        # to regenerate bundle.js.
        run: |
          # Step 1: ensure dist/ exists (it's gitignored)
          mkdir -p test/headless-smoke/dist
          # Step 2: clear any stale content (preserve .gitkeep if present)
          find test/headless-smoke/dist -type f -not -name ".gitkeep" -delete
          # Step 3: copy src/ to dist/ (this includes all source + the
          # banner-{1x,2x,3x}.png icons from B5)
          cp -r src/. test/headless-smoke/dist/
          # Step 4: build bundle.js from the new dist/
          python3 tools/ci/build-bundle.py
          # Step 5: verify dist/ has the right structure
          ls test/headless-smoke/dist/ | head -20
          ls test/headless-smoke/dist/icons/ | head -10
          # The banner-{1x,2x,3x}.png should be in icons/
          test -f test/headless-smoke/dist/icons/banner-1x.png && echo "banner-1x.png present" || (echo "banner-1x.png MISSING"; exit 1)
          test -f test/headless-smoke/dist/icons/banner-2x.png && echo "banner-2x.png present" || (echo "banner-2x.png MISSING"; exit 1)
          test -f test/headless-smoke/dist/icons/banner-3x.png && echo "banner-3x.png present" || (echo "banner-3x.png MISSING"; exit 1)

      - name: Run the headless smoke test
        # The smoke runs 15 detection cases in real Chrome 150+ and
        # writes a JSON report. 15/15 PASS = ship gate.
        run: |
          ./test/headless-smoke/headless-smoke-bin \
            --dist test/headless-smoke/dist \
            --output smoke-report.json \
            2>&1 | tee smoke-output.log
          # The exit code is 0 if all 15 pass, 1 if any fail
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "Smoke FAILED with exit code $EXIT"
            cat smoke-report.json 2>/dev/null || echo "(no report file)"
            exit $EXIT
          fi
          # Show the summary
          python3 -c "
          import json
          r = json.load(open('smoke-report.json'))
          print('total:', r['total'])
          print('passed:', r['passed'])
          print('failed:', r['failed'])
          print('gate:', r['gate'])
          for x in r['results']:
            status = 'PASS' if x['passed'] else 'FAIL'
                        print("  [" + str(status) + "] " + str(x["name"]))
          "

      - name: Upload smoke report
        # Save the report as a workflow artifact (retained for 7 days)
        # so failures can be investigated even after the run finishes.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload unit test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: unit-test-output.log
          retention-days: 7
          if-no-files-found: warn
