# AegisGate Lens - Security Workflow
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-tests:
    name: Security Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: "Security: CSP gate"
        run: |
          # Check for actual eval()/Function()/innerHTML usage (not regex patterns or comments)
          # Regex patterns like /eval\(/ are detection patterns, not code execution
          
          # Filter out: node_modules, __pycache__, comments, regex patterns (re:), and Python files
          if grep -rn 'eval(' src/ --include="*.js" 2>/dev/null | grep -v "node_modules" | grep -v "__pycache__" | grep -v "re: " | grep -v "//.*eval(" | head -5; then
            echo "ERROR: CSP gate failed. Found actual eval() usage in src/"
            exit 1
          fi
          
          if grep -rn 'new Function(' src/ --include="*.js" 2>/dev/null | grep -v "node_modules" | grep -v "__pycache__" | head -5; then
            echo "ERROR: CSP gate failed. Found new Function() in src/"
            exit 1
          fi
          
          # innerHTML is only used safely on banner-ui.js (with escaped content)
          if grep -rn 'innerHTML' src/ --include="*.js" 2>/dev/null | grep -v "node_modules" | grep -v "__pycache__" | grep -v "banner-ui.js" | head -5; then
            echo "ERROR: CSP gate failed. Found innerHTML in src/"
            exit 1
          fi
          
          echo "CSP gate passed"

      - name: "Security: Bundle signature verification (F-02)"
        run: |
          BUNDLE="models/prompt-injection-v0.1.0-beta/aegisgate-lens-prompt-injection-v0.1.0-beta.bundle"
          if [ -f "$BUNDLE" ]; then
            node test/security-bundle-verification.test.mjs || echo "::warning::bundle verification test failed (not a blocker)"
          else
            echo "::notice::No ML bundle found at $BUNDLE; skipping bundle verification"
          fi

      - name: "Security: Sender-id validation (F-01)"
        run: |
          if [ -f src/background.js ]; then
            if ! grep -q "sender.id" src/background.js; then
              echo "ERROR: F-01 violation. background.js does not validate sender.id"
              exit 1
            fi
          fi
          echo "✅ F-01 sender-id validation present"

      - name: "Security: No external npm dependencies"
        run: |
          if [ -f package.json ]; then
            echo "ERROR: package.json found. The Lens must have zero npm deps."
            exit 1
          fi
          echo "✅ No external npm dependencies"

      - name: "DCO sign-off check"
        run: |
          COMMITS=$(git log --pretty=format:"%H" ${{ github.event.before }}..${{ github.event.after }} 2>/dev/null | head -10)
          for c in $COMMITS; do
            MSG=$(git log -1 --pretty=format:"%B" $c)
            if ! echo "$MSG" | grep -q "Signed-off-by:"; then
              echo "::warning::Commit $c missing Signed-off-by"
            fi
          done
          echo "✅ DCO check complete"

  secret-scan:
    name: "Trivy filesystem secret scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  dependency-scan:
    name: "Trivy filesystem dependency scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
