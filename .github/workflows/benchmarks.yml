name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/benchmarks/**'
      - 'tools/bench/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regex-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'


      - name: Regex latency benchmark
        run: |
          node tools/bench/run-benchmark.js --save | tee benchmark-regex.txt

      - name: Check for regressions
        run: |
          echo "## Regex Benchmark Regression Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          FAIL=0
          # Check p99 latency thresholds per input size (in ms)
          # p99 must be under these thresholds (2x+ of observed baselines)
          while IFS= read -r line; do
            if echo "$line" | grep -qE 'p99.*ms'; then
              P99=$(echo "$line" | grep -oP '[\d.]+' | head -1)
              SIZE=$(echo "$line" | grep -oP '\d+ chars')
              echo "- ${SIZE}: p99=${P99}ms" >> $GITHUB_STEP_SUMMARY
              # Flag if p99 > 5ms for any size (baseline max was ~6.6ms for 100 chars)
              if (( $(echo "$P99 > 15.0" | bc -l) )); then
                FAIL=1
                echo "❌ ${SIZE}: p99=${P99}ms exceeds 15ms threshold" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done < benchmark-regex.txt

          if [ "$FAIL" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Result: FAIL** — latency regression detected" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Result: PASS** — all latencies within thresholds" >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-results
          path: benchmark-regex.txt

  sxc-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'


      - name: SXC corpus benchmark
        run: |
          node test/benchmarks/run-sxc-benchmark.mjs | tee benchmark-sxc.txt

      - name: Check detection metrics
        run: |
          echo "## SXC Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          FAIL=0
          # Extract key metrics from output
          LOOSE_RECALL=$(grep 'Loose Recall' benchmark-sxc.txt | grep -oP '[\d.]+%' | head -1 | tr -d '%')
          FPR=$(grep 'FPR' benchmark-sxc.txt | grep -oP '[\d.]+%' | head -1 | tr -d '%')

          echo "- Loose Recall: ${LOOSE_RECALL}%" >> $GITHUB_STEP_SUMMARY
          echo "- FPR: ${FPR}%" >> $GITHUB_STEP_SUMMARY

          # Loose recall must be >= 90%
          if (( $(echo "${LOOSE_RECALL:-0} < 90.0" | bc -l) )); then
            FAIL=1
            echo "❌ Loose Recall ${LOOSE_RECALL}% below 90% threshold" >> $GITHUB_STEP_SUMMARY
          fi

          # FPR must be <= 10%
          if (( $(echo "${FPR:-100} > 10.0" | bc -l) )); then
            FAIL=1
            echo "❌ FPR ${FPR}% above 10% threshold" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Result: FAIL** — detection metrics below thresholds" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Result: PASS** — detection metrics within thresholds" >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-sxc
          path: benchmark-sxc.txt
