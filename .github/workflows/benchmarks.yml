name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/benchmarks/**'
      - 'tools/bench/**'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regex-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'


      - name: Regex latency benchmark
        run: |
          node tools/bench/run-benchmark.js --save | tee benchmark-regex.txt

      - name: Check for regressions
        shell: node {0}
        run: |
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('test/benchmarks/results/v0.1.4-baseline.json', 'utf8'));
          const THRESHOLD = 15.0;
          let fail = false;
          let summary = '## Regex Benchmark Regression Check\n\n';
          for (const size of results.sizes) {
            summary += `- ${size.label}: p99=${size.p99.toFixed(4)}ms\n`;
            if (size.p99 > THRESHOLD) {
              fail = true;
              summary += `❌ ${size.label}: p99=${size.p99}ms exceeds ${THRESHOLD}ms threshold\n`;
            }
          }
          summary += '\n**Result: ' + (fail ? 'FAIL' : 'PASS') + '**\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          if (fail) process.exit(1);

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-results
          path: benchmark-regex.txt

  sxc-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'


      - name: SXC corpus benchmark
        run: |
          node test/benchmarks/run-sxc-benchmark.mjs | tee benchmark-sxc.txt

      - name: Check detection metrics
        shell: node {0}
        run: |
          const fs = require('fs');
          const output = fs.readFileSync('benchmark-sxc.txt', 'utf8');
          const recallMatch = output.match(/Loose Recall[:\s]+([\d.]+)%/);
          const fprMatch = output.match(/FPR[:\s]+([\d.]+)%/);
          const recall = recallMatch ? parseFloat(recallMatch[1]) : 0;
          const fpr = fprMatch ? parseFloat(fprMatch[1]) : 100;
          let fail = false;
          let summary = '## SXC Benchmark Results\n\n';
          summary += `- Loose Recall: ${recall}%\n`;
          summary += `- FPR: ${fpr}%\n`;
          if (recall < 90) { fail = true; summary += `❌ Loose Recall ${recall}% below 90% threshold\n`; }
          if (fpr > 10) { fail = true; summary += `❌ FPR ${fpr}% above 10% threshold\n`; }
          summary += '\n**Result: ' + (fail ? 'FAIL' : 'PASS') + '**\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          if (fail) process.exit(1);

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-sxc
          path: benchmark-sxc.txt
